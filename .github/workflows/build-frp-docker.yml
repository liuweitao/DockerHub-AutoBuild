name: Build FRP Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'frp/**'
      - 'scripts/**'
      - 'tests/**'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
      - '.github/workflows/build-frp-docker.yml'
  schedule:
    - cron: '29 0 * * *'  # UTC; stagger daily checks
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-images.yml
    with:
      target: frp
    secrets: inherit
