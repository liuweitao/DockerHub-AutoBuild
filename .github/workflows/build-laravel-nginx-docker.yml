name: Build Laravel Nginx Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'laravel/nginx/**'
      - 'scripts/check-nginx-version.py'
      - 'tests/nginx/**'
      - '.github/workflows/build-laravel-nginx-docker.yml'
  schedule:
    - cron: '0 0 * * *'  # 每天运行一次
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laravel-nginx-${{ github.ref }}
  cancel-in-progress: false

env:
  UID: 1000
  GID: 1000

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/laravel-nginx
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test upstream update detection
        run: python3 -m unittest discover -s tests/nginx -v

      - name: Check latest Nginx stable Alpine image
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            --connect-timeout 15 --max-time 60 \
            'https://hub.docker.com/v2/repositories/library/nginx/tags?page_size=100&name=stable-alpine' \
            -o "$RUNNER_TEMP/nginx-tags.json"
          python3 scripts/check-nginx-version.py "$RUNNER_TEMP/nginx-tags.json"

      - name: Set up Docker Buildx
        if: env.BUILD_NEEDED == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build fresh image for validation
        if: env.BUILD_NEEDED == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./laravel/nginx
          pull: true
          no-cache: true
          load: true
          push: false
          tags: local/laravel-nginx:check
          build-args: |
            NGINX_VERSION=${{ env.NGINX_BASE_REF }}
            UID=${{ env.UID }}
            GID=${{ env.GID }}

      - name: Verify Nginx configuration and Laravel user
        if: env.BUILD_NEEDED == 'true'
        run: |
          set -euo pipefail
          docker run --rm --add-host php:127.0.0.1 local/laravel-nginx:check nginx -t
          docker run --rm --entrypoint sh local/laravel-nginx:check -ec \
            'nginx -v; test "$(id -u laravel)" = 1000; test "$(id -g laravel)" = 1000'

      - name: Login to Docker Hub
        if: env.BUILD_NEEDED == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish validated image
        if: env.BUILD_NEEDED == 'true'
        run: |
          set -euo pipefail
          docker tag local/laravel-nginx:check "$IMAGE:$NGINX_VERSION"
          docker push "$IMAGE:$NGINX_VERSION"
          docker tag local/laravel-nginx:check "$IMAGE:latest"
          docker push "$IMAGE:latest"

      - name: Record published upstream version and digest
        if: env.BUILD_NEEDED == 'true'
        run: |
          set -euo pipefail
          printf '%s\n' "$NGINX_VERSION" > .nginx-version
          printf '%s\n' "$NGINX_DIGEST" > .nginx-digest
          git add .nginx-version .nginx-digest
          if ! git diff --cached --quiet; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git commit -m "Update Nginx base image to $NGINX_VERSION@$NGINX_DIGEST"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
