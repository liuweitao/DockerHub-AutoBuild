name: Build Laravel Nginx Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'laravel/nginx/**'
      - 'scripts/**'
      - 'tests/**'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
      - '.github/workflows/build-laravel-nginx-docker.yml'
  schedule:
    - cron: '31 0 * * *'  # UTC; stagger daily checks
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-images.yml
    with:
      target: nginx
    secrets: inherit
