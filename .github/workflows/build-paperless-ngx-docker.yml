name: Build Paperless-ngx Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'paperless-ngx/**'
      - 'scripts/**'
      - 'tests/**'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
      - '.github/workflows/build-paperless-ngx-docker.yml'
  schedule:
    - cron: '59 0 * * *'  # UTC; stagger daily checks
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-images.yml
    with:
      target: paperless
    secrets: inherit
