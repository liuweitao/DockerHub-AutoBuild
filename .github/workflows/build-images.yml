name: Resolve, validate and publish images

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      version:
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: autobuild-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      state: ${{ steps.upstream.outputs.state }}
      matrix: ${{ steps.upstream.outputs.matrix }}
      build_needed: ${{ steps.upstream.outputs.build_needed }}
      publish_latest: ${{ steps.upstream.outputs.publish_latest }}
    steps:
      - uses: actions/checkout@v7
      - name: Test update selection and publication state
        run: python3 -m unittest discover -s tests/autobuild -v
      - name: Resolve immutable upstream inputs
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python3 scripts/resolve-upstream.py "$TARGET" --version "$REQUESTED_VERSION"

  build:
    needs: resolve
    if: needs.resolve.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}
      IMAGE_TAGS: ${{ matrix.tags }}
      VALIDATION_PROFILE: ${{ matrix.validate }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        if: matrix.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Prepare publication tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'tags<<IMAGE_TAGS_EOF'
            while IFS= read -r tag; do
              test -n "$tag"
              printf '%s:%s\n' "$IMAGE" "$tag"
            done <<< "$IMAGE_TAGS"
            echo 'IMAGE_TAGS_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build fresh image for runtime validation
        if: matrix.validate != ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          pull: true
          no-cache: true
          load: true
          push: false
          tags: local/autobuild:check
          build-args: ${{ matrix.args }}
      - name: Validate PHP or Nginx runtime
        if: matrix.validate != ''
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VALIDATION_PROFILE" = nginx ]; then
            docker run --rm --add-host php:127.0.0.1 local/autobuild:check nginx -t
            docker run --rm --entrypoint sh local/autobuild:check -ec \
              'nginx -v; test "$(id -u laravel)" = 1000; test "$(id -g laravel)" = 1000'
          else
            python3 scripts/check-php-image.py local/autobuild:check "$VALIDATION_PROFILE"
          fi
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish validated image
        if: matrix.validate != ''
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker tag local/autobuild:check "$IMAGE:$tag"
            for attempt in 1 2 3; do
              if docker push "$IMAGE:$tag"; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep "$((attempt * 5))"
            done
          done <<< "$IMAGE_TAGS"
      - name: Build and publish platform images
        if: matrix.validate == ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ matrix.args }}

  record:
    needs: [resolve, build]
    if: needs.resolve.outputs.publish_latest == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - name: Record successfully published upstream state
        env:
          BUILD_STATE: ${{ needs.resolve.outputs.state }}
        run: python3 scripts/record-build-state.py
