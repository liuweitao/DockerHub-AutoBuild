name: Build PHPCMS PHP Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'php/phpcms/**'
      - 'scripts/**'
      - 'tests/**'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
      - '.github/workflows/build-phpcms-docker.yml'
      - 'php/common/**'
  schedule:
    - cron: '7 1 * * *'  # UTC; stagger daily checks
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-images.yml
    with:
      target: phpcms
    secrets: inherit
