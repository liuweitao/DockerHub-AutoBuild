name: Build PHPCMS PHP Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'php/phpcms/**'
      - 'php/common/**'
      - '.dockerignore'
      - 'scripts/check-php-image.py'
      - 'tests/php/**'
      - '.github/workflows/build-phpcms-docker.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 0'

permissions:
  contents: read

concurrency:
  group: php-security-phpcms-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/php
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build fresh image for validation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./php/phpcms/Dockerfile
          pull: true
          no-cache: true
          load: true
          push: false
          tags: local/php-security-check:phpcms
          build-args: |
            UID=1000
            GID=1000

      - name: Verify security settings, extensions and web workers
        run: python3 scripts/check-php-image.py local/php-security-check:phpcms phpcms

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish validated image
        run: |
          set -euo pipefail
          docker tag local/php-security-check:phpcms "$IMAGE:7.4.30-phpcms"
          docker push "$IMAGE:7.4.30-phpcms"
          docker tag local/php-security-check:phpcms "$IMAGE:7.4-phpcms"
          docker push "$IMAGE:7.4-phpcms"
