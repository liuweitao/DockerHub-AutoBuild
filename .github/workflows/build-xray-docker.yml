name: Build Xray Docker

on:
  push:
    branches: [master]
    paths:
      - 'xray/**'
      - 'scripts/**'
      - 'tests/**'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
      - '.github/workflows/build-xray-docker.yml'
  schedule:
    - cron: '19 1 * * *'  # UTC; stagger daily checks
  workflow_dispatch:
    inputs:
      version:
        description: '指定 Release 标签；留空跟进最新稳定版。指定版本仅发布版本标签。'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-images.yml
    with:
      target: xray
      version: ${{ inputs.version || '' }}
    secrets: inherit
