name: Build CoreDNS Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'coredns/**'
      - 'scripts/**'
      - 'tests/**'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
      - '.github/workflows/build-coredns-docker.yml'
  schedule:
    - cron: '17 0 * * *'  # UTC; stagger daily checks
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-images.yml
    with:
      target: coredns
    secrets: inherit
