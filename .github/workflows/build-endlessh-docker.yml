name: Build Endlessh Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'endlessh/**'
      - 'scripts/**'
      - 'tests/**'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
      - '.github/workflows/build-endlessh-docker.yml'
  schedule:
    - cron: '23 0 * * *'  # UTC; stagger daily checks
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-images.yml
    with:
      target: endlessh
    secrets: inherit
