name: Build NaiveProxy Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'naiveproxy/**'
      - 'scripts/**'
      - 'tests/**'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
      - '.github/workflows/build-naiveproxy-docker.yml'
  schedule:
    - cron: '47 0 * * *'  # UTC; stagger daily checks
  workflow_dispatch:
    inputs:
      version:
        description: '指定 Release 标签；留空跟进最新稳定版。指定版本仅发布版本标签。'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-images.yml
    with:
      target: naiveproxy
      version: ${{ inputs.version || '' }}
    secrets: inherit
