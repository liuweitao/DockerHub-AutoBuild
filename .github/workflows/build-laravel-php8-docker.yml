name: Build Laravel PHP 8 Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'laravel/php8/**'
      - 'scripts/**'
      - 'tests/**'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
      - '.github/workflows/build-laravel-php8-docker.yml'
  schedule:
    - cron: '41 0 * * *'  # UTC; stagger daily checks
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-images.yml
    with:
      target: php8
    secrets: inherit
