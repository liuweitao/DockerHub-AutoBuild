name: Build Laravel PHP 7.4 Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'laravel/php7.4/**'
      - 'scripts/**'
      - 'tests/**'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
      - '.github/workflows/build-laravel-php74-docker.yml'
      - 'php/common/**'
  schedule:
    - cron: '37 0 * * *'  # UTC; stagger daily checks
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-images.yml
    with:
      target: php74
    secrets: inherit
