name: Build Caddy Docker Images

on:
  push:
    branches:
      - master
    paths:
      - 'caddy/**'
      - '.github/workflows/build-caddy-images.yml'
  schedule:
    - cron: '0 0 * * *'  # 每天运行一次
  workflow_dispatch:  # 允许手动触发

concurrency:
  group: build-caddy-images
  cancel-in-progress: false

jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      caddy_version: ${{ steps.check_version.outputs.caddy_version }}
      build_needed: ${{ steps.check_version.outputs.build_needed }}
      version_changed: ${{ steps.check_version.outputs.version_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for new Caddy version
        id: check_version
        shell: bash
        run: |
          AVAILABLE_TAGS=$(curl --fail --silent --show-error \
            'https://registry.hub.docker.com/v2/repositories/library/caddy/tags?page_size=100' \
            | jq -r '.results[].name')
          MATCHING_TAG=$(echo "$AVAILABLE_TAGS" \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)

          if [ -z "$MATCHING_TAG" ]; then
            echo "No suitable Caddy tag found"
            exit 1
          fi

          CURRENT_VERSION=""
          if [ -f .caddy-version ]; then
            CURRENT_VERSION=$(cat .caddy-version)
          fi

          VERSION_CHANGED=false
          if [ "$MATCHING_TAG" != "$CURRENT_VERSION" ]; then
            VERSION_CHANGED=true
          fi

          BUILD_NEEDED=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            BUILD_NEEDED=$VERSION_CHANGED
          fi

          echo "Latest Caddy version: $MATCHING_TAG"
          echo "Tracked Caddy version: ${CURRENT_VERSION:-none}"
          echo "Build needed: $BUILD_NEEDED"
          echo "caddy_version=$MATCHING_TAG" >> "$GITHUB_OUTPUT"
          echo "build_needed=$BUILD_NEEDED" >> "$GITHUB_OUTPUT"
          echo "version_changed=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"

  build_images:
    needs: check_version
    if: needs.check_version.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: caddy-cf
            modules: --with github.com/caddy-dns/cloudflare
          - image: caddy-webdav
            modules: --with github.com/caddy-dns/cloudflare --with github.com/mholt/caddy-webdav
          - image: caddy-naive
            modules: --with github.com/caddyserver/forwardproxy=github.com/klzgrad/forwardproxy@naive
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ./caddy
          file: ./caddy/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ needs.check_version.outputs.caddy_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            CADDY_VERSION=${{ needs.check_version.outputs.caddy_version }}
            CADDY_MODULES=${{ matrix.modules }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  update_version:
    needs:
      - check_version
      - build_images
    if: needs.check_version.outputs.version_changed == 'true' && needs.build_images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Update tracked Caddy version
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --ff-only origin master
          echo "${{ needs.check_version.outputs.caddy_version }}" > .caddy-version
          git add .caddy-version

          if git diff --cached --quiet; then
            echo "Caddy version is already up to date"
            exit 0
          fi

          git commit -m "更新 Caddy 版本至 ${{ needs.check_version.outputs.caddy_version }}"
          git push origin master
