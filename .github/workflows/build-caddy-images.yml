name: Build Caddy Docker Images

on:
  push:
    branches: [master]
    paths:
      - 'caddy/**'
      - 'scripts/**'
      - 'tests/**'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
      - '.github/workflows/build-caddy-images.yml'
  schedule:
    - cron: '11 0 * * *'  # UTC; stagger daily checks
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-images.yml
    with:
      target: caddy
    secrets: inherit
