name: Build Nextcloud Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'nextcloud/**'
      - 'scripts/**'
      - 'tests/**'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
      - '.github/workflows/build-nextcloud-docker.yml'
  schedule:
    - cron: '53 0 * * *'  # UTC; stagger daily checks
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-images.yml
    with:
      target: nextcloud
    secrets: inherit
