name: Build Realm Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'realm/**'
      - 'scripts/**'
      - 'tests/**'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
      - '.github/workflows/build-realm-docker.yml'
  schedule:
    - cron: '13 1 * * *'  # UTC; stagger daily checks
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-images.yml
    with:
      target: realm
    secrets: inherit
