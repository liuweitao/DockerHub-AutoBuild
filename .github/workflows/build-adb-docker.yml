name: Build ADB Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'adb/**'
      - 'scripts/**'
      - 'tests/**'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
      - '.github/workflows/build-adb-docker.yml'
  schedule:
    - cron: '7 0 * * *'  # UTC; stagger daily checks
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-images.yml
    with:
      target: adb
    secrets: inherit
