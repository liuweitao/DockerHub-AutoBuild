services:
  caddy:
    image: liuweitao/caddy-webdav:latest
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data:/data
      - ./config:/config
      - ./webdav_data:/srv/webdav
    environment:
      - CLOUDFLARE_API_TOKEN=your_cloudflare_api_token
    restart: unless-stopped
