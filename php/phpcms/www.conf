; Active settings preserved from the original PHPCMS pool configuration.
[www]
user = www
group = www
; The official image's zz-docker.conf overrides this to listen = 9000,
; preserving access from the existing nginx/caddy container network.
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

php_admin_flag[log_errors] = on
php_admin_flag[session.upload_progress.enabled] = off
